name: Manual Update Temporal Revision

on:
  workflow_dispatch:  # Only runs when triggered manually

jobs:
  update-temporal:
    runs-on: namespace-profile-mercury-oss-linux
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # needed for branch creation

      # Mounts /nix from the Namespace cache volume; must run before Nix is
      # installed so the store lands on the volume.
      - name: Set up nix cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: nix

      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Updates core/rust/Cargo.toml, Cargo.lock, Cargo.nix, crate-hashes.json,
      # temporal_bridge.h and protos/. A bump usually needs bridge and Haskell
      # fixes, so a failure still commits the partial result for a human to
      # finish (see docs/upgrading-rust-sdk.md).
      - name: Run update script
        id: update-script
        continue-on-error: true
        run: nix run .#update-temporal-revision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes and create branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Log the script outcome
          if [[ "${{ steps.update-script.outcome }}" == "success" ]]; then
            echo "Update script completed successfully"
          else
            echo "Update script completed with errors (but continuing to commit any changes)"
          fi

          # `git status` also reports new untracked files, such as new
          # generated proto modules.
          if [[ -n "$(git status --porcelain)" ]]; then
            branch="auto/update-temporal-revision-$(date +%Y%m%d)"
            git checkout -b "$branch"
            git add .

            # Create appropriate commit message based on script success
            if [[ "${{ steps.update-script.outcome }}" == "success" ]]; then
              commit_msg="chore: auto-update temporal revision"
            else
              commit_msg="chore: auto-update temporal revision (partial - some steps failed)"
            fi

            git commit -m "$commit_msg"
            git push origin "$branch"
            echo "Created branch: $branch"
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
