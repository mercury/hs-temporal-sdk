language = "C"

autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
cpp_compat = false

[parse]
parse_deps = true
# Only these crates define types or functions that cross the FFI boundary.
# The temporalio-* crates stay behind opaque pointers such as `ClientRef`.
include = ["temporal_bridge", "ffi-convert"]
extra_bindings = ["ffi-convert"]
