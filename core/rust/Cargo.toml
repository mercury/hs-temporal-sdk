[package]
name = "temporal_bridge"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
temporalio-client = { git = "https://github.com/temporalio/sdk-rust", rev = "0bf830696a9952bd56629983b8dda373503d4bc3", features = ["core-based-sdk"] }
temporalio-sdk-core = { git = "https://github.com/temporalio/sdk-rust", rev = "0bf830696a9952bd56629983b8dda373503d4bc3", features = ["ephemeral-server"] }
temporalio-common = { git = "https://github.com/temporalio/sdk-rust", rev = "0bf830696a9952bd56629983b8dda373503d4bc3", features = ["serde_serialize", "otel"] }
tokio = "~1.52"
tokio-stream = "~0.1"
tonic = "~0.14"
tonic-prost = "~0.14"
tracing = "~0.1"
tracing-subscriber = "~0.3.21"
url = "~2.5"
ffi-convert = "~0.7"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
prost = "~0.14"
prost-types = { version = "~0.7", package = "prost-wkt-types" }
libc = "~0.2"
async-trait = "0.1"
anyhow = "~1.0"

[profile.release]
opt-level = 3
debug = false
lto = true
incremental = true
